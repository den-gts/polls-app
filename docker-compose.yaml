services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-polls}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    command:
      - uv
      - run
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  # Что бы не держать в голове про применение миграций. Ну и заодно и статику при первом запуске, чтоб 2 раза не вставать
  # будкем на каждый docker compose up запускать применение миграций и создание статики. Они иденпотенты.
  migrate:
    build: .
    command: >
      sh -c " uv run python manage.py migrate &&
              uv run python manage.py createsuperuser  --noinput || true &&
              uv run python manage.py collectstatic --noinput"
    env_file:
      - .env
    volumes:
      - .:/app
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static: