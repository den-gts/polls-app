services:
  db:
    image: postgres:alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-polls}
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    command:
      - uv
      - run
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000
    depends_on:
      - db

volumes:
  postgres_data: