[project]
name = "polls"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3"
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "djangorestframework-stubs>=3.18.2", # pycharm мне напомнил про библиотеку с заглушками типов для DRF
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"